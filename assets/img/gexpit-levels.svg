      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgGrad3)" rx="8"/>
  <!-- Key Gamma Horizontal Bands -->
  <!-- Call Wall -->
  <rect x="50" y="45" width="500" height="28" fill="rgba(0, 255, 136, 0.12)" stroke="rgba(0, 255, 136, 0.4)" stroke-width="1" rx="4"/>
  <text x="65" y="64" font-family="monospace" font-size="11" font-weight="bold" fill="#00ff88">MAX CALL WALL: 6025 (GAMMA +$1.42B)</text>
  
  <!-- Zero Gamma Pivot -->
  <rect x="50" y="150" width="500" height="32" fill="rgba(0, 212, 255, 0.15)" stroke="#00d4ff" stroke-width="1.5" rx="4" filter="drop-shadow(0 0 10px rgba(0,212,255,0.3))"/>
  <text x="65" y="171" font-family="monospace" font-size="11" font-weight="bold" fill="#00d4ff">ZERO GAMMA FLIP BOUNDARY: 5995.50</text>
  
  <!-- Put Wall -->
  <rect x="50" y="260" width="500" height="28" fill="rgba(255, 77, 77, 0.12)" stroke="rgba(255, 77, 77, 0.4)" stroke-width="1" rx="4"/>
  <text x="65" y="279" font-family="monospace" font-size="11" font-weight="bold" fill="#ff4d4d">MAJOR PUT WALL: 5970 (GAMMA -$1.85B)</text>
  
  <!-- Spot Price Indicator -->
  <line x1="50" y1="120" x2="550" y2="120" stroke="#ffd700" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="280" cy="120" r="5" fill="#ffd700" filter="drop-shadow(0 0 6px #ffd700)"/>
  <text x="300" y="115" font-family="monospace" font-size="11" font-weight="bold" fill="#ffd700">INDEX SPOT: 6008.25 (POSITIVE REGIME)</text>
</svg>