<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="streamGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 212, 255, 0)"/>
      <stop offset="50%" stop-color="rgba(0, 212, 255, 0.4)"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="560" fill="url(#termBg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="320" x2="1000" y2="320"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="480" x2="1000" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="800" y1="0" x2="800" y2="560"/>
  </g>

  <!-- Left Telemetry Panel -->
  <rect x="30" y="30" width="300" height="500" fill="rgba(18, 22, 32, 0.5)" rx="6" stroke="rgba(255,255,255,0.06)"/>
  <text x="50" y="65" font-family="monospace" font-size="13" font-weight="bold" fill="#00d4ff">SPX 0DTE ORDER FLOW</text>
  
  <g font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="50" y="110">INDEX SPOT</text>
    <text x="230" y="110" font-weight="bold" fill="#ffd700">6,008.40</text>

    <text x="50" y="150">NET GAMMA (GEX)</text>
    <text x="230" y="150" font-weight="bold" fill="#00ff88">+$3.18B</text>

    <text x="50" y="190">ZERO GAMMA FLIP</text>
    <text x="230" y="190" font-weight="bold" fill="#00d4ff">5,995.50</text>

    <text x="50" y="230">CALL WALL</text>
    <text x="230" y="230" font-weight="bold" fill="#00ff88">6,025.00</text>

    <text x="50" y="270">PUT WALL</text>
    <text x="230" y="270" font-weight="bold" fill="#ff4d4d">5,970.00</text>

    <text x="50" y="310">NET VANNA</text>
    <text x="230" y="310" font-weight="bold" fill="#38bdf8">+$412M</text>

    <text x="50" y="350">CVD DELTA 5M</text>
    <text x="230" y="350" font-weight="bold" fill="#00ff88">+14,890</text>

    <text x="50" y="390">ENGINE LATENCY</text>
    <text x="230" y="390" font-weight="bold" fill="#00ff88">84 μs</text>

    <text x="50" y="430">THROUGHPUT</text>
    <text x="230" y="430" font-weight="bold" fill="#e2e8f0">48,200 msg/s</text>
    
    <text x="50" y="470">REGIME</text>
    <text x="230" y="470" font-weight="bold" fill="#00ff88">PINNING / CALL</text>
  </g>

  <!-- Right Chart & Stream Area -->
  <rect x="360" y="30" width="610" height="500" fill="rgba(18, 22, 32, 0.5)" rx="6" stroke="rgba(255,255,255,0.06)"/>
  <text x="390" y="65" font-family="monospace" font-size="13" font-weight="bold" fill="#ffd700">SUB-MILLISECOND GAMMA CURVE &amp; LIQUIDITY BANDS</text>
  
  <!-- Zero Gamma Crossing Glow Line -->
  <line x1="380" y1="280" x2="950" y2="280" stroke="rgba(0, 212, 255, 0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="800" y="272" font-family="monospace" font-size="10" fill="#00d4ff">ZERO GAMMA: 5995.50</text>

  <!-- Real-time Gamma Profile Fill -->
  <path d="M 380 340 Q 480 310, 560 270 T 680 180 T 800 120 T 950 90 L 950 500 L 380 500 Z" fill="rgba(0, 212, 255, 0.06)"/>
  
  <!-- Main GEX Profile Curve -->
  <path d="M 380 340 Q 480 310, 560 270 T 680 180 T 800 120 T 950 90" fill="none" stroke="#00d4ff" stroke-width="3" filter="drop-shadow(0 0 10px rgba(0,212,255,0.7))"/>
  
  <!-- Spot Price Line -->
  <line x1="380" y1="220" x2="950" y2="220" stroke="#ffd700" stroke-width="2"/>
  <circle cx="720" cy="220" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
  <text x="735" y="215" font-family="monospace" font-size="11" font-weight="bold" fill="#ffd700">SPOT: 6008.40</text>

  <!-- Live Flow Pulses -->
  <g font-family="monospace" font-size="10" fill="#64748b">
    <text x="390" y="500">[15:59:59.812] TICK PROCESSED • REPLAY BUFFER 0 LAG • MEMORY FOOTPRINT 14.2MB</text>
  </g>
</svg>