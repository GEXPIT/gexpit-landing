<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="heatCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 212, 255, 0.05)"/>
      <stop offset="50%" stop-color="rgba(0, 212, 255, 0.35)"/>
      <stop offset="100%" stop-color="rgba(0, 212, 255, 0.8)"/>
    </linearGradient>
    <linearGradient id="heatGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 215, 0, 0.1)"/>
      <stop offset="70%" stop-color="rgba(255, 215, 0, 0.5)"/>
      <stop offset="100%" stop-color="rgba(255, 215, 0, 0.9)"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgGrad)" rx="8"/>
  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="60" y1="40" x2="560" y2="40"/>
    <line x1="60" y1="100" x2="560" y2="100"/>
    <line x1="60" y1="160" x2="560" y2="160"/>
    <line x1="60" y1="220" x2="560" y2="220"/>
    <line x1="60" y1="280" x2="560" y2="280"/>
    <line x1="160" y1="20" x2="160" y2="300"/>
    <line x1="260" y1="20" x2="260" y2="300"/>
    <line x1="360" y1="20" x2="360" y2="300"/>
    <line x1="460" y1="20" x2="460" y2="300"/>
  </g>
  <!-- Price Axis -->
  <g font-family="monospace" font-size="10" fill="#64748b">
    <text x="15" y="44">6020</text>
    <text x="15" y="104">6010</text>
    <text x="15" y="164">6000</text>
    <text x="15" y="224">5990</text>
    <text x="15" y="284">5980</text>
  </g>
  <!-- Heatmap Density Blocks -->
  <rect x="60" y="85" width="500" height="30" fill="url(#heatCyan)" opacity="0.75" rx="4"/>
  <rect x="180" y="145" width="380" height="30" fill="url(#heatGold)" opacity="0.65" rx="4"/>
  <rect x="60" y="205" width="500" height="30" fill="url(#heatCyan)" opacity="0.45" rx="4"/>
  <rect x="320" y="265" width="240" height="25" fill="rgba(0, 255, 136, 0.4)" rx="4"/>
  <!-- Price Path Trace -->
  <path d="M 60 210 Q 140 180, 220 155 T 380 150 T 480 100 T 560 95" fill="none" stroke="#ffd700" stroke-width="2.5" filter="drop-shadow(0 0 6px rgba(255,215,0,0.6))"/>
  <!-- Callout -->
  <circle cx="560" cy="95" r="4" fill="#ffd700"/>
  <text x="440" y="80" font-family="monospace" font-size="11" font-weight="bold" fill="#00d4ff">MAJOR CALL WALL 6010</text>
</svg>